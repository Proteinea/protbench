[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[options]
packages = "find:"
zip_safe = "True"

[project]
name = "protbench"
authors = [
    {name="Mohamed Shaffei", email="shaffei@proteinea.com"},
    {name="Hazem Essam", email="hazem@proteinea.com"}
]
maintainers = [
    {name="Mohamed Shaffei", email="shaffei@proteinea.com"},
    {name="Hazem Essam", email="hazem@proteinea.com"}
]
version = "1.0.0"

requires-python = ">=3.7"

description = "Protbench is a framework that is used to benchmark Protein Language Models on different tasks."
long_description = "file: README.md"

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "accelerate==1.4.0",
    "biopython==1.85",
    "datasets==3.3.2",
    "einops==0.8.1",
    "hydra-core==1.3.2",
    "sentencepiece==0.2.0",
    "scikit-learn==1.6.1",
    "transformers==4.49.0",
    "wandb==0.19.7",
    "peft==0.14.0",
    "torch==2.6.0",
    "safetensors==0.5.2",
    "huggingface-hub==0.29.1",
    "torchvision==0.21.0",
]

[tool.black]
line-length = 79 
target-version = ['py38']
force-exclude = "__init__.py"

[tool.isort]
force_single_line = true