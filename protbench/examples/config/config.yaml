convbert_config:
  dropout: 0.1
  hidden_dim: 768
  kernel_size: 7
  nhead: 4
  num_layers: 1
env_variables:
  WANDB_PROJECT: Benchmarking
lora_config:
  alpha: 32
  bias: none
  dropout: 0.1
  rank: 16
  target_modules: null
  use_lora: true
model_checkpoints:
- ankh:
  - ankh-base
  - ankh-large
  - ankh-v2-23
  - ankh-v2-32
  - ankh-v2-33
  - ankh-v2-41
  - ankh-v2-45
- esm2:
  - esm2_650M
  - esm2_3B
  - esm2_15B
- prottrans:
  - prott5
- ankh3:
  - ankh3-large
  - ankh3-xl
pooling_config:
  name: avg
shifting_config:
  shift_left: null
  shift_right: null
tasks:
- ssp3_casp12
- ssp3_casp14
- ssp3_cb513
- ssp3_ts115
- ssp8_casp14
- ssp8_casp12
- ssp8_cb513
- ssp8_ts115
- deeploc
- solubility
- remote_homology
- fluorescence
- gb1_sampled
- thermostability
tokenizer_config:
  max_length: null
  padding: false
  truncation: false
train_config:
  evaluation_strategy: epoch
  gradient_accumulation_steps: 16
  gradient_checkpointing: false
  learning_rate: 0.001
  logging_steps: 10
  low_memory: true
  num_train_epochs: 20
  num_trials_per_checkpoint: 1
  per_device_eval_batch_size: 1
  per_device_train_batch_size: 1
  report_to: wandb
  save_strategy: epoch
  seed: 7
  warmup_steps: 1000
  weight_decay: 0.0
